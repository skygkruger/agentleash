# ═══════════════════════════════════════════════════════════════
# AGENTLEASH CI/CD WORKFLOW
# GitHub Actions for testing and deployment
# ═══════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # TYPECHECK JOB
  # TypeScript compilation check for all packages
  # ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared
        working-directory: ./shared
        run: npx tsc --noEmit

      - name: Typecheck CLI
        working-directory: ./cli
        run: npx tsc --noEmit

      - name: Typecheck Daemon
        working-directory: ./daemon
        run: npx tsc --noEmit

      - name: Typecheck API
        working-directory: ./api
        run: npx tsc --noEmit

      - name: Typecheck Web
        working-directory: ./web
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # TEST JOB
  # Run tests for all packages
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run Daemon tests
        working-directory: ./daemon
        run: npx jest --ci --coverage

  # ─────────────────────────────────────────────────────────────
  # LINT JOB
  # Code quality checks
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        working-directory: ./api
        run: npm run lint

      - name: Lint Daemon
        working-directory: ./daemon
        run: npm run lint

      - name: Lint CLI
        working-directory: ./cli
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # BUILD JOB
  # Build all packages
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        working-directory: ./cli
        run: npm run build

      - name: Verify CLI shebang
        working-directory: ./cli
        run: head -1 dist/index.js | grep -q '#!/usr/bin/env node'

      - name: Build Daemon
        working-directory: ./daemon
        run: npm run build

      - name: Verify Daemon shebang
        working-directory: ./daemon
        run: head -1 dist/index.js | grep -q '#!/usr/bin/env node'

      - name: Build Web
        working-directory: ./web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.agentleash.io

  # ─────────────────────────────────────────────────────────────
  # DEPLOY API JOB
  # Deploy to Railway on main branch
  # ─────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: api

  # ─────────────────────────────────────────────────────────────
  # DEPLOY WEB JOB
  # Deploy to Vercel on main branch
  # ─────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./web

  # ─────────────────────────────────────────────────────────────
  # PUBLISH CLI JOB
  # Publish to npm on version tag
  # ─────────────────────────────────────────────────────────────
  publish-cli:
    name: Publish CLI
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish CLI
        working-directory: ./cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Daemon
        working-directory: ./daemon
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
