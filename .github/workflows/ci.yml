# ═══════════════════════════════════════════════════════════════
# SCOPEAGENT CI/CD WORKFLOW
# GitHub Actions for testing and deployment
# ═══════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # TEST JOB
  # Run tests for all packages
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        working-directory: ./api
        run: npm test
        env:
          JWT_SECRET: test-secret
          NODE_ENV: test

      - name: Run Daemon tests
        working-directory: ./daemon
        run: npm test

      - name: Run CLI tests
        working-directory: ./cli
        run: npm test

      - name: Build packages
        run: |
          npm run build --workspace=@scopeagent/api
          npm run build --workspace=@scopeagent/daemon
          npm run build --workspace=@scopeagent/cli

  # ─────────────────────────────────────────────────────────────
  # LINT JOB
  # Code quality checks
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        working-directory: ./api
        run: npm run lint

      - name: Lint Daemon
        working-directory: ./daemon
        run: npm run lint

      - name: Lint CLI
        working-directory: ./cli
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # BUILD WEB JOB
  # Build Next.js application
  # ─────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: ./web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.scopeagent.io

  # ─────────────────────────────────────────────────────────────
  # DEPLOY API JOB
  # Deploy to Railway on main branch
  # ─────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: api

  # ─────────────────────────────────────────────────────────────
  # DEPLOY WEB JOB
  # Deploy to Vercel on main branch
  # ─────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [test, lint, build-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./web

  # ─────────────────────────────────────────────────────────────
  # PUBLISH CLI JOB
  # Publish to npm on version tag
  # ─────────────────────────────────────────────────────────────
  publish-cli:
    name: Publish CLI
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        working-directory: ./cli
        run: npm run build

      - name: Publish to npm
        working-directory: ./cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # DOCKER BUILD JOB
  # Build and push Docker images on version tag
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            veridian/scopeagent-api:${{ steps.version.outputs.VERSION }}
            veridian/scopeagent-api:latest

      - name: Build and push Daemon
        uses: docker/build-push-action@v5
        with:
          context: ./daemon
          push: true
          tags: |
            veridian/scopeagent-daemon:${{ steps.version.outputs.VERSION }}
            veridian/scopeagent-daemon:latest
